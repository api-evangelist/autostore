aid: autostore
name: AutoStore
description: 'AutoStore is a global warehouse robotics and technology company headquartered
  in Nedre Vats, Norway, that pioneered the cube storage automated storage and retrieval
  system (AS/RS). Its goods-to-person solution combines autonomous robots, an aluminum
  storage grid of stacked bins, workstation ports, and controlling software (marketed
  as CubeVerse, spanning design, simulation, operations, and predictive diagnostics)
  to fulfill orders in a fraction of the floor space of conventional warehouses. With
  more than 1,950 systems deployed across nearly 65 countries, AutoStore serves retail,
  grocery, 3PL, healthcare, and industrial customers. Systems are distributed, designed,
  installed, and serviced through a global network of qualified system integrators
  rather than a public developer/API program. AutoStore was surfaced as a portfolio
  company of SoftBank Vision Fund and added to the API Evangelist network.'
